<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#08070b" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Camille Ng — SFU computer science student building software across machine learning, automation, and full-stack development." />
    <title>camille ng</title>
    <script>
      (() => {
        const storageKey = 'camille-theme';
        let savedTheme = null;

        try {
          savedTheme = localStorage.getItem(storageKey);
        } catch {
          savedTheme = null;
        }

        const theme = savedTheme === 'light' || savedTheme === 'dark' ? savedTheme : 'dark';

        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark'
          ? '#08070b'
          : '#f4f5f6';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
